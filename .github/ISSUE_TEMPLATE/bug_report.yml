name: 缺陷报告
description: 报告可复现的问题
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "提交前请删除邮箱、用户名、账号 ID、API 地址、Key、令牌、项目路径、聊天和原始日志。"
  - type: input
    id: version
    attributes:
      label: 切换器版本
      placeholder: "0.2.5-preview"
    validations:
      required: true
  - type: input
    id: desktop_version
    attributes:
      label: Codex Desktop 版本
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构账号名称和移除后的路径描述，不粘贴真实数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 已确认报告不含密码、令牌、账号标识、私人路径或聊天内容
          required: true
