name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          $version = (Get-Content -Raw version.txt).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version.txt: $version" }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG.TrimStart('v') -ne $version) { throw "Release tag and version.txt differ." }
          $notesPath = "docs/zh-CN/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw 'Version release notes are missing.' }
          $notes = [IO.File]::ReadAllText((Join-Path $PWD $notesPath)).Replace("`r`n", "`n").Trim()
          if ($env:RELEASE_TAG -and $env:RELEASE_BODY.Replace("`r`n", "`n").Trim() -cne $notes) { throw 'GitHub Release body differs from the bundled release notes.' }

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0, Node 24
        with:
          dotnet-version: '10.0.x'

      - name: Restore and audit dependencies
        shell: pwsh
        run: |
          dotnet restore .\CodexProfileSwitcher.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore or vulnerability audit failed.' }

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build .\CodexProfileSwitcher.sln --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
          dotnet test .\CodexProfileSwitcher.sln --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Solution tests failed.' }
          .\tests\test-launcher.ps1

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup --exact --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build installer
        shell: pwsh
        run: |
          .\build-installer.ps1 -OutputDirectory .\dist
          Get-ChildItem .\dist | Get-FileHash -Algorithm SHA256

      - name: Validate isolated installation
        shell: pwsh
        run: |
          $version = (Get-Content -Raw version.txt).Trim()
          .\tests\test-installer.ps1 -SetupPath ".\dist\Codex-Profile-Switcher-Setup-$version.exe"

      - name: Attach installer and checksum
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4, Node 24
        with:
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: false
          files: |
            dist/*
